<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPG · Painel de Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14181c;--panel:#1c2227;--panel-2:#242b31;--border:#343c44;--text:#e7e5e0;--text-dim:#8b939b;--amber:#e8a33d;--amber-dim:#7a5a26;--teal:#57b3ac;--red:#d6584a;--green:#6fae66;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--display:'Oswald',var(--sans);--rivet-hi:#5c6672;--radius:3px;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1b2126,transparent),repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 28px),var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.hazard{height:6px;background:repeating-linear-gradient(135deg,var(--amber) 0 10px,#1a1a1a 10px 20px);border-bottom:1px solid #000}
.riveted{background-image:radial-gradient(circle 2.4px at 9px 9px,var(--rivet-hi) 0 60%,transparent 62%),radial-gradient(circle 2.4px at calc(100% - 9px) 9px,var(--rivet-hi) 0 60%,transparent 62%),radial-gradient(circle 2.4px at 9px calc(100% - 9px),var(--rivet-hi) 0 60%,transparent 62%),radial-gradient(circle 2.4px at calc(100% - 9px) calc(100% - 9px),var(--rivet-hi) 0 60%,transparent 62%);background-repeat:no-repeat}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--panel),var(--bg))}
.brand{display:flex;align-items:center;gap:12px}
.brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);border:1px solid var(--amber-dim);padding:3px 7px;border-radius:2px;background:repeating-linear-gradient(135deg,rgba(232,163,61,.07) 0 6px,transparent 6px 12px)}
.brand h1{font-family:var(--display);font-size:19px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.status{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase}
.dot-ring{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#2a3138,#10141a 70%);border:1px solid #000}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim)}
.dot.ok{background:var(--green);box-shadow:0 0 7px 1px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 7px 1px var(--red)}
main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 67px)}
@media (max-width:820px){main{grid-template-columns:1fr}.col-list{border-right:none!important;border-bottom:1px solid var(--border)}.row3,.row2{grid-template-columns:1fr!important}}
.col-list{border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:14px}
.col-detail{padding:24px 28px}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-dim);display:flex;justify-content:space-between}
.filme-list{display:flex;flex-direction:column;gap:8px}
.filme-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:4px;text-transform:none;letter-spacing:0;font-weight:400}
.filme-card:hover{border-left-color:var(--amber-dim)}
.filme-card.active{border-left-color:var(--amber);border-color:var(--amber-dim);background:var(--panel-2)}
.filme-card .dims{font-family:var(--mono);font-size:15px;color:var(--amber)}
.filme-card .dims small{color:var(--text-dim);font-size:11px}
.filme-card .coment{font-size:12.5px;color:var(--text-dim);line-height:1.4}
.filme-card .meta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
button{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:9px 13px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 0 rgba(0,0,0,.4)}
button:hover{border-color:var(--amber-dim)}
button:active{transform:translateY(1px)}
button.primary{background:var(--amber);color:#1a1305;border-color:var(--amber)}
button.primary:hover{filter:brightness(1.08)}
button.danger{background:#2c1512;color:#f08a7e;border-color:#71332b}
button.danger:hover{border-color:var(--red)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.placeholder{height:100%;display:flex;flex-direction:column;justify-content:center;color:var(--text-dim);gap:6px;max-width:420px}
.placeholder .big{font-family:var(--mono);font-size:13px}
.dim-note{color:var(--text-dim);font-family:var(--mono);font-size:12px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--border);padding-bottom:16px;margin-bottom:20px;gap:16px;position:relative}
.detail-head::before{content:'';position:absolute;left:0;bottom:-2px;width:64px;height:2px;background:var(--amber)}
.detail-head .dims{font-family:var(--mono);font-size:28px;color:var(--amber)}
.detail-head .dims .unit{font-family:var(--sans);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.detail-head .coment{color:var(--text-dim);font-size:13.5px;margin-top:4px;max-width:60ch}
.detail-head .id{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.06em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sec-title{font-family:var(--display);font-size:14px;letter-spacing:.08em;color:var(--text-dim);font-weight:600;margin:0 0 10px;text-transform:uppercase}
.sec-title.spaced{margin-top:26px}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px 14px}
.setup-card .top-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:9px;border-bottom:1px dashed var(--border)}
.setup-card .op{font-size:12.5px;color:var(--text-dim)}
.setup-card .setup-id{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:10px}
.readout .k{font-size:9.5px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase}
.readout .v{font-family:var(--mono);font-size:15px;color:var(--teal);background:#0a0d11;border:1px solid #040506;border-radius:2px;padding:4px 8px;display:inline-block;min-width:2.6em;text-shadow:0 0 6px rgba(87,179,172,.55)}
.readout .v.temp{color:var(--amber);text-shadow:0 0 6px rgba(232,163,61,.55)}
.setup-card .desc{font-size:12.5px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:8px;line-height:1.4}
.resinas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.resina-pill{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:3px 7px;border-radius:20px}
.resina-pill b{color:var(--text)}
.empty{color:var(--text-dim);font-size:13px;font-style:italic;padding:8px 0}
.feedback-list{display:flex;flex-direction:column;gap:10px}
.feedback-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:var(--radius);padding:12px 14px}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.fb-user{font-size:12.5px;color:var(--teal);font-weight:600}
.fb-date{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
.fb-body{font-size:13px;line-height:1.5;white-space:pre-wrap}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px 16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:10.5px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase}
.field input,.field textarea{background:#0e1217;border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
form h4{font-family:var(--display);margin:0 0 14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);padding-bottom:10px;border-bottom:1px solid var(--border)}
.resina-row{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;align-items:end;margin-bottom:8px}
.resina-row .field{margin-bottom:0}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.msg{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:2px;margin-bottom:12px;border-left:3px solid}
.msg.error{background:#2c1512;color:var(--red);border:1px solid #4a231e;border-left-color:var(--red)}
.msg.ok{background:#132a19;color:var(--green);border:1px solid #234a2c;border-left-color:var(--green)}
@media (prefers-reduced-motion:no-preference){.blink{animation:blink 1.1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}}

/* ---------- abas + tags ---------- */
.tabs{display:flex;border-bottom:1px solid var(--border);margin:-4px 0 0}
.tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;box-shadow:none;color:var(--text-dim);padding:9px 6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.tab:hover{color:var(--text);border-color:transparent;border-bottom-color:var(--amber-dim)}
.tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.tag-bar{display:flex;flex-wrap:wrap;gap:6px}
.tag-chip{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:500;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:20px;box-shadow:none}
.tag-chip:hover{color:var(--text);border-color:var(--teal)}
.tag-chip.on{background:rgba(87,179,172,.14);border-color:var(--teal);color:var(--teal)}
.tag-chip.new{border-style:dashed;color:var(--amber);border-color:var(--amber-dim);background:rgba(232,163,61,.08)}
.tag-chip .x{margin-left:6px;opacity:.7}
.tag-pill{font-family:var(--mono);font-size:10px;color:var(--teal);border:1px solid rgba(87,179,172,.4);padding:1px 7px;border-radius:20px;background:rgba(87,179,172,.08)}
.tag-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.detail-head .tag-pills{margin-top:10px}
.tagpicker{border:1px solid var(--border);border-radius:2px;padding:10px;background:#0e1217;display:flex;flex-direction:column;gap:10px}
.tp-label{font-size:9.5px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px}
.tp-new{display:flex;gap:8px}
.tp-new input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13px;padding:7px 10px}
.tp-new input:focus{outline:none;border-color:var(--amber)}

/* ---------- imagens ---------- */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.img-card{margin:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.img-thumb{padding:0;border:none;border-bottom:1px solid var(--border);border-radius:0;background:#0a0d11;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;box-shadow:none;cursor:zoom-in}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.img-thumb:hover img{transform:scale(1.04)}
.img-card figcaption{padding:9px 11px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.img-desc{font-size:12.5px;line-height:1.4}
.img-desc.none{color:var(--text-dim);font-style:italic}
.img-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:auto}
.img-del{padding:1px 7px;font-size:14px;line-height:1.2;background:transparent;box-shadow:none;color:var(--text-dim)}
.img-del:hover{color:#f08a7e;border-color:var(--red)}
.img-thumb.broken{display:flex;align-items:center;justify-content:center;cursor:default}
.img-thumb.broken::after{content:'imagem indisponível';font-family:var(--mono);font-size:11px;color:var(--red)}
.lightbox{position:fixed;inset:0;background:rgba(5,7,9,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:50;cursor:zoom-out}
.lightbox img{max-width:min(94vw,1400px);max-height:82vh;object-fit:contain;border:1px solid var(--border);background:#000}
.lb-cap{color:var(--text);font-size:13.5px;max-width:70ch;text-align:center}
.file-drop{border:1px dashed var(--border);border-radius:2px;padding:14px;background:#0e1217;display:flex;flex-direction:column;gap:10px}
.file-drop input[type=file]{color:var(--text-dim);font-family:var(--mono);font-size:12px}
.file-drop input[type=file]::file-selector-button{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:7px 11px;margin-right:10px;cursor:pointer}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.preview-grid img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--border);border-radius:2px;display:block}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}

/* ---------- documentação ---------- */
.doc-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.doc-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.doc-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
.doc-body{font-size:13.5px;line-height:1.6;max-width:80ch}
.doc-body p{margin:0 0 10px}
.doc-body h4,.doc-body h5,.doc-body h6{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 6px;color:var(--amber)}
.doc-body h4{font-size:16px}.doc-body h5{font-size:14px}.doc-body h6{font-size:12.5px;color:var(--text-dim)}
.doc-body ul,.doc-body ol{margin:0 0 10px;padding-left:22px}
.doc-body li{margin:2px 0}
.doc-body code{font-family:var(--mono);font-size:12px;background:#0e1217;border:1px solid var(--border);border-radius:2px;padding:0 5px}
.doc-card textarea{min-height:260px;resize:vertical;line-height:1.5}

/* ---------- minimizar ---------- */
.list-head{display:flex;justify-content:space-between;align-items:center}
.list-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-dim)}
.collapse-btn{padding:3px 11px;font-size:16px;line-height:1.2}
.list-body{display:flex;flex-direction:column;gap:14px;flex:1}
main.list-collapsed .list-body{display:none}
@media (min-width:821px){
  main.list-collapsed{grid-template-columns:56px 1fr}
  main.list-collapsed .col-list{padding:20px 8px}
  main.list-collapsed .list-head{justify-content:center}
  main.list-collapsed .list-title{display:none}
}
.sec{margin-bottom:22px}
.sec-title{border-bottom:1px solid var(--border);margin:0 0 12px}
.sec-toggle{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;box-shadow:none;border-radius:0;padding:5px 0;color:var(--text-dim);font-family:var(--display);font-size:14px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;text-align:left}
.sec-toggle:hover{color:var(--text);border-color:transparent}
.chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin:-3px 4px 0 2px;flex:none}
.sec.collapsed .chev{transform:rotate(-45deg);margin-top:0}
.sec.collapsed .sec-body{display:none}
.sec.collapsed .sec-title{margin-bottom:0}
.sec-count{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:0 7px;color:var(--text-dim);letter-spacing:0}
.sec-count:empty{display:none}

/* ---------- busca + lista rolável ---------- */
.search{position:relative}
.search input{width:100%;background:#0e1217;border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 10px}
.search input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
.search input::placeholder{color:var(--text-dim);font-size:12px}
@media (min-width:821px){
  /* a lista rola sozinha e mantém a posição enquanto o detalhe volta para o topo */
  .col-list{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="tag">PPG · EXTRUSÃO</span><h1>Painel de Filmes</h1></div>
  <div class="status"><span class="dot-ring"><span class="dot" id="statusDot"></span></span><span id="statusText">verificando conexão…</span></div>
</header>
<div class="hazard"></div>
<main>
  <div class="col-list">
    <div class="list-head">
      <span class="list-title">FILMES</span>
      <button type="button" class="ghost collapse-btn" id="btnToggleList" aria-expanded="true" aria-controls="listBody" title="Minimizar lista de filmes">‹</button>
    </div>
    <div class="list-body" id="listBody">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabAll" aria-selected="true" data-tab="all">TODOS</button>
      <button class="tab" role="tab" id="tabTag" aria-selected="false" data-tab="tag">POR TAG</button>
    </div>
    <div id="tagBarWrap" hidden>
      <div class="section-label" style="margin-bottom:8px"><span>TAGS</span><span id="tagCount"></span></div>
      <div class="tag-bar" id="tagBar"></div>
    </div>
    <div class="search"><input type="search" id="busca" placeholder="Buscar: código, tamanho, comentário, tag…" aria-label="Buscar filmes" autocomplete="off"></div>
    <div class="section-label"><span id="listLabel">FILMES CADASTRADOS</span><span id="filmeCount"></span></div>
    <div class="filme-list" id="filmeList"><span class="dim-note">carregando<span class="blink">…</span></span></div>
    <button class="primary" id="btnNovoFilme" style="margin-top:auto">+ Novo filme</button>
    </div>
  </div>
  <div class="col-detail" id="detail">
    <div class="placeholder"><div class="big">/// nenhum filme selecionado</div><div>Escolha um filme na lista ao lado para ver os setups e comentários, ou cadastre um filme novo.</div></div>
  </div>
</main>

<script>
// Aponte para o backend para que o Live Server não trate /listAll como um arquivo local.
// Endereço do backend. Com o Nether (npx nether-dev), chamadas para localhost são
// redirecionadas automaticamente para o backend do PC, no celular também.
// Sem o Nether, use ?api=https://seu-backend na URL da página.
const API_BASE_URL = (new URLSearchParams(location.search).get('api') || 'http://localhost:8080').replace(/\/+$/, '');
const post = (body) => ({ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
async function handleJson(res){
  if(!res.ok){
    let d=''; try{ d = await res.text(); }catch(e){}
    throw new Error('HTTP '+res.status+(d ? ' — '+d.slice(0,200) : ''));
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;   // aceita respostas sem corpo (ex.: DELETE void)
}
const API = {
  listAll: () => fetch(API_BASE_URL+'/listAll').then(handleJson),
  filterForID: (id) => fetch(API_BASE_URL+'/filterForID?idFilme='+encodeURIComponent(id)).then(handleJson),
  novoFilme: (b) => fetch(API_BASE_URL+'/novoFilme', post(b)).then(handleJson),
  addNewSetup: (b) => fetch(API_BASE_URL+'/addNewSetup', post(b)).then(handleJson),
  feedBack: (b) => fetch(API_BASE_URL+'/feedBack', post(b)).then(handleJson),
  deleteFilme: (id) => fetch(API_BASE_URL+'/deletFilme?idFilme='+encodeURIComponent(id), { method:'DELETE' }).then(handleJson),
  // ----- imagens (multipart: não definir Content-Type, o navegador coloca o boundary) -----
  uploadImagem: (idFilme, nomeOperador, descricao, file) => {
    const fd = new FormData();
    fd.append('idFilme', idFilme);
    fd.append('nomeOperador', nomeOperador);
    if(descricao) fd.append('descricao', descricao);
    fd.append('file', file);
    return fetch(API_BASE_URL+'/addImagem', { method:'POST', body:fd }).then(handleJson);
  },
  deleteImagem: (id) => fetch(API_BASE_URL+'/deletImagem?idImagem='+encodeURIComponent(id), { method:'DELETE' }).then(handleJson),
  // ----- documentação -----
  getDoc: (idFilme) => fetch(API_BASE_URL+'/documentacao?idFilme='+encodeURIComponent(idFilme)).then(handleJson),
  saveDoc: (b) => fetch(API_BASE_URL+'/documentacao', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) }).then(handleJson),
  // ----- tags -----
  allTags: () => fetch(API_BASE_URL+'/allTags').then(handleJson),
  filterForTag: (nome) => fetch(API_BASE_URL+'/filterForTag?nameForTag='+encodeURIComponent(nome)).then(handleJson),
  createNewTag: (nome) => fetch(API_BASE_URL+'/createNewTag', post({ nameForTag:nome })).then(handleJson),
  // /addTeg recebe idFIlme e TagRequest como parâmetros de query (sem @RequestBody)
  addTag: (idFilme, nome) => fetch(API_BASE_URL+'/addTeg?idFIlme='+encodeURIComponent(idFilme)+'&nameForTag='+encodeURIComponent(nome), { method:'POST' }).then(handleJson),
};

let busca='';
const buscaEl=$('busca');
const semAcento=(t)=>String(t??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
// "600x50" vira dois termos (600 e 50); todos os termos precisam aparecer no filme
function searchTokens(){
  return semAcento(busca).split(/\s+/).flatMap(t=>/^\d+[x×]\d+$/.test(t)?t.split(/[x×]/):[t]).filter(t=>t&&t!=='x'&&t!=='×');
}
function matchFilme(f,tokens){
  const hay=semAcento([f.codigoMaterial,f.tamanhoDoFilme,f.espessuraDoFilme,f.comentarioDoFilme,'#'+f.id,...getTags(f)].join(' | '));
  return tokens.every(t=>hay.includes(t));
}

async function loadFilmes(){
  try{
    filmes = await API.listAll();

  }catch(err){
    statusDot.className='dot bad'; statusText.textContent='sem conexão com a API';

async function loadTags(){
  try{ allTags = (await API.allTags()).map(tagName).filter(Boolean); }
  catch(e){ /* tags indisponíveis: o painel continua funcionando */ }
}

/* ---------- abas ---------- */
async function setTab(t){

async function selectTag(nome){

  activeTag=nome; renderTagBar();

  catch(err){ filmeListEl.innerHTML=`<div class="msg error">Não foi possível filtrar por tag.<br>${esc(err.message)}</div>`; }
}

/* ---------- lista ---------- */
function renderFilmeList(){
  const base = tab==='tag' ? tagResults : filmes, tokens = searchTokens();
  const src = tokens.length ? base.filter(f=>matchFilme(f,tokens)) : base;
  listLabelEl.textContent = tab==='tag' ? (activeTag ? 'TAG: '+activeTag.toUpperCase() : 'FILTRO POR TAG') : 'FILMES CADASTRADOS';
  filmeCountEl.textContent = (tab==='tag' && !activeTag) ? '' : (tokens.length ? src.length+'/'+base.length : (src.length || ''));
  if(tab==='tag' && !activeTag){ filmeListEl.innerHTML='<div class="empty">Escolha uma tag acima para filtrar os filmes.</div>'; return; }
  if(!src.length && tokens.length && base.length){ filmeListEl.innerHTML=`<div class="empty">Nenhum filme encontrado para “${esc(busca.trim())}”.</div>`; return; }
  if(!src.length){ filmeListEl.innerHTML = tab==='tag' ? `<div class="empty">Nenhum filme com a tag “${esc(activeTag)}”.</div>` : '<div class="empty">Nenhum filme cadastrado ainda.</div>'; return; }
  filmeListEl.innerHTML='';
  src.forEach(f=>{
    const nS=(f.listSetupUnits||[]).length, nF=getFeedbacks(f).length, tags=getTags(f);
    const card=document.createElement('button');
    card.className='filme-card'+(f.id===activeId?' active':'');

    card.addEventListener('click',()=>selectFilme(f.id,true));

// Aceita feedBack / feedback / listFeedBack etc., já que o nome varia no DTO.
function getFeedbacks(f){
  const e=Object.entries(f||{}).find(([k,v])=>/feedback/i.test(k)&&Array.isArray(v));
  return e?e[1]:[];
}

// Tags: aceita campo "tags", "listTags", "list"... (array de string ou de objeto com nameForTag)
function tagName(t){
  if(t==null) return '';
  if(typeof t==='string') return t.trim();
  return String(t.nameForTag||t.nomeTag||t.nome||t.name||t.tag||'').trim();
}
function getTags(f){
  const e=Object.entries(f||{}).find(([k,v])=>/tag/i.test(k)&&Array.isArray(v));
  return e?e[1].map(tagName).filter(Boolean):[];
}

// <img src="http://localhost:8080/..."> não passa pelo Nether (ele só intercepta fetch/XHR).
// Por isso a imagem é baixada com fetch e exibida como blob.
const blobCache=new Map();
async function loadBlobUrl(url){
  if(blobCache.has(url)) return blobCache.get(url);
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const u=URL.createObjectURL(await r.blob());
  blobCache.set(url,u);
  return u;
}

// Imagens: aceita campo "imagens", "listImagens", "images"... (array de ImagemResponse)
function getImages(f){
  const e=Object.entries(f||{}).find(([k,v])=>/imagem|imagen|image|foto/i.test(k)&&Array.isArray(v));
  return e?e[1]:[];
}
function imgUrl(im){
  const u=im.url||('/imagem/'+im.id);
  return /^https?:/i.test(u)?u:API_BASE_URL+u;
}
function openLightbox(src, caption){
  const o=document.createElement('div'); o.className='lightbox';
  o.innerHTML=`<img src="${esc(src)}" alt=""><div class="lb-cap">${esc(caption||'')}</div>`;
  const close=()=>{ o.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=(e)=>{ if(e.key==='Escape') close(); };
  o.addEventListener('click',close); document.addEventListener('keydown',onKey);
  document.body.appendChild(o);
}

/* ---------- seletor de tags (existente ou nova) ---------- */
// Monta o seletor dentro de `root`. Retorna { get() } com os nomes escolhidos.
function makeTagPicker(root, initial=[]){
  const selected=[...initial];
  root.classList.add('tagpicker');
  root.innerHTML=`
    <div><div class="tp-label">Selecionadas</div><div class="tag-bar" data-r="sel"></div></div>
    <div><div class="tp-label">Tags existentes</div><div class="tag-bar" data-r="exist"></div></div>
    <div><div class="tp-label">Criar nova tag</div>
      <div class="tp-new"><input data-r="inp" placeholder="ex.: BOPP, Fosco, Alta barreira" maxlength="60"><button type="button" class="ghost" data-r="add">+ tag</button></div>
    </div>`;
  const q=(k)=>root.querySelector(`[data-r=${k}]`);
  const canon=(n)=>allTags.find(t=>t.toLowerCase()===n.toLowerCase())||n;
  const has=(n)=>selected.some(s=>s.toLowerCase()===n.toLowerCase());
  function add(raw){
    const n=canon(String(raw||'').trim());
    if(!n||has(n)) return;
    selected.push(n); draw();
  }
  function draw(){
    q('sel').innerHTML = selected.length
      ? selected.map(n=>`<button type="button" class="tag-chip on${allTags.some(t=>t.toLowerCase()===n.toLowerCase())?'':' new'}" data-n="${esc(n)}" title="Remover">${esc(n)}${allTags.some(t=>t.toLowerCase()===n.toLowerCase())?'':' · nova'}<span class="x">×</span></button>`).join('')
      : '<span class="dim-note">nenhuma tag selecionada</span>';
    q('exist').innerHTML = allTags.length
      ? allTags.map(n=>`<button type="button" class="tag-chip${has(n)?' on':''}" data-n="${esc(n)}">${esc(n)}</button>`).join('')
      : '<span class="dim-note">nenhuma tag existente — crie a primeira abaixo</span>';
    q('sel').querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{
      const i=selected.findIndex(s=>s===b.dataset.n); if(i>=0) selected.splice(i,1); draw();
    }));
    q('exist').querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{
      const n=b.dataset.n, i=selected.findIndex(s=>s.toLowerCase()===n.toLowerCase());
      if(i>=0) selected.splice(i,1); else selected.push(n); draw();
    }));
  }
  q('add').addEventListener('click',()=>{ const i=q('inp'); add(i.value); i.value=''; i.focus(); });
  q('inp').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); add(e.target.value); e.target.value=''; } });
  draw();
  return {
    get(){
      // inclui o que ficou digitado e não foi adicionado
      const pending=q('inp').value.trim(); if(pending){ add(pending); q('inp').value=''; }
      return [...selected];
    }
  };
}

// Cria no backend as tags que ainda não existem. Retorna a lista final de nomes.
async function ensureTags(names){
  const out=[];
  for(const n of names){
    const existing=allTags.find(t=>t.toLowerCase()===n.toLowerCase());
    if(!existing){ await API.createNewTag(n); allTags.push(n); out.push(n); }
    else out.push(existing);
  }
  return out;
}

/* ---------- adicionar tag a filme existente (POST /addTeg) ---------- */
function renderAddTagForm(filme){
  const atuais=getTags(filme);
  detailEl.innerHTML=`
    <div class="panel riveted" style="max-width:560px">
      <form id="formAddTag">
        <h4>Adicionar tag — filme #${filme.id}</h4>
        <div id="formMsg"></div>
        ${atuais.length?`<div class="field"><label>Tags atuais</label><div class="tag-pills">${atuais.map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('')}</div></div>`:''}
        <div class="field"><label>Tags a adicionar</label><div id="tagPicker"></div></div>
        <div class="form-actions">
          <button type="button" class="ghost" id="cancelAddTag">Cancelar</button>
          <button type="submit" class="primary">Adicionar</button>
        </div>
      </form>
    </div>`;
  const picker=makeTagPicker($('tagPicker'));
  $('cancelAddTag').addEventListener('click',()=>selectFilme(filme.id));
  $('formAddTag').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const msg=$('formMsg'), btn=ev.target.querySelector('[type=submit]');
    const novas=picker.get().filter(n=>!atuais.some(a=>a.toLowerCase()===n.toLowerCase()));
    if(!novas.length){ msg.innerHTML='<div class="msg error">Selecione ou crie ao menos uma tag nova para este filme.</div>'; return; }
    btn.disabled=true;
    try{
      const nomes=await ensureTags(novas);
      for(const n of nomes) await API.addTag(filme.id, n);
      await loadFilmes(); await selectFilme(filme.id);
    }catch(err){
      msg.innerHTML=`<div class="msg error">Falha ao adicionar tag: ${esc(err.message)}</div>`;
      btn.disabled=false;
    }
  });
}

/* ---------- documentação (GET/PUT /documentacao) ---------- */
// Markdown simplificado e seguro: o texto é escapado antes de qualquer formatação.
function mdInline(t){ return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function mdToHtml(src){
  const lines=esc(src).split('\n'); let out='', list=null, para=[];
  const flushP=()=>{ if(para.length){ out+='<p>'+para.map(mdInline).join('<br>')+'</p>'; para=[]; } };
  const closeL=()=>{ if(list){ out+='</'+list+'>'; list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ flushP(); closeL(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ flushP(); closeL(); const n=m[1].length+3; out+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>'; continue; }
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){ flushP(); if(list!=='ul'){ closeL(); out+='<ul>'; list='ul'; } out+='<li>'+mdInline(m[1])+'</li>'; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=='ol'){ closeL(); out+='<ol>'; list='ol'; } out+='<li>'+mdInline(m[1])+'</li>'; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL();
  return out;
}
const docAreaFor=(idFilme)=>{ const a=$('docArea'); return (a && a.dataset.id===String(idFilme)) ? a : null; };

async function loadDoc(idFilme){
  const area=docAreaFor(idFilme); if(!area) return;
  area.innerHTML='<div class="dim-note">carregando documentação<span class="blink">…</span></div>';
  try{ const doc=await API.getDoc(idFilme); showDoc(idFilme,doc); }
  catch(err){ const a=docAreaFor(idFilme); if(a) a.innerHTML=`<div class="msg error">Não foi possível carregar a documentação.<br>${esc(err.message)}</div>`; }
}

function showDoc(idFilme, doc){
  const area=docAreaFor(idFilme); if(!area) return;
  const has=(doc.conteudo||'').trim();
  area.innerHTML=`
    <div class="doc-card">
      <div class="doc-bar">
        <span class="doc-meta">${doc.atualizadoPor?`Editado por ${esc(doc.atualizadoPor)} · ${fmtDate(doc.atualizadoEm)}`:'Sem edições ainda'}</span>
        <button type="button" class="ghost" id="btnEditDoc">${has?'Editar':'Escrever documentação'}</button>
      </div>
      ${has?`<div class="doc-body">${mdToHtml(doc.conteudo)}</div>`:'<div class="empty">Este filme ainda não tem documentação.</div>'}
    </div>`;
  $('btnEditDoc').addEventListener('click',()=>editDoc(idFilme,doc));
}

function editDoc(idFilme, doc){
  const area=docAreaFor(idFilme); if(!area) return;
  let cur=doc, lastOp=''; try{ lastOp=localStorage.getItem('ppg.operador')||''; }catch(e){}
  const original=doc.conteudo||'';
  area.innerHTML=`
    <form id="formDoc" class="doc-card">
      <div id="docMsg"></div>
      <div class="field"><label>Seu nome</label><input name="nomeEditor" value="${esc(lastOp)}" autocomplete="name" required></div>
      <div class="field"><label>Documentação</label>
        <textarea name="conteudo" maxlength="20000" placeholder="Escreva aqui: parâmetros, cuidados, histórico de problemas, dicas de operação…">${esc(original)}</textarea>
        <div class="hint"># Título · ## Subtítulo · - lista · 1. lista numerada · **negrito** · &#96;código&#96; &nbsp;|&nbsp; <span id="docCount"></span></div>
      </div>
      <div class="form-actions">
        <button type="button" class="ghost" id="cancelDoc">Cancelar</button>
        <button type="submit" class="primary">Salvar documentação</button>
      </div>
    </form>`;
  const ta=area.querySelector('textarea'), count=$('docCount');
  const upd=()=>{ count.textContent=ta.value.length+' / 20000'; }; ta.addEventListener('input',upd); upd(); ta.focus();
  $('cancelDoc').addEventListener('click',()=>{
    if(ta.value!==original && !confirm('Descartar as alterações não salvas?')) return;
    showDoc(idFilme,cur);
  });
  $('formDoc').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const fd=new FormData(ev.target), msg=$('docMsg'), btn=ev.target.querySelector('[type=submit]');
    const nomeEditor=String(fd.get('nomeEditor')||'').trim(), conteudo=String(fd.get('conteudo')||'');
    if(!nomeEditor){ msg.innerHTML='<div class="msg error">Informe o seu nome.</div>'; return; }
    try{ localStorage.setItem('ppg.operador',nomeEditor); }catch(e){}
    btn.disabled=true;
    try{
      const saved=await API.saveDoc({ idFilme, conteudo, nomeEditor, versao: cur.versao ?? null });
      showDoc(idFilme,saved);
    }catch(err){
      btn.disabled=false;
      if(/^HTTP 409/.test(err.message)){
        // alguém salvou antes: pega a versão atual, mas mantém o texto digitado
        try{
          cur=await API.getDoc(idFilme);
          msg.innerHTML=`<div class="msg error">${esc(cur.atualizadoPor||'Alguém')} editou esta documentação${cur.atualizadoEm?' em '+fmtDate(cur.atualizadoEm):''} enquanto você escrevia. O seu texto continua no campo: salvar de novo substitui a versão dele. Para ver o que ele escreveu, cancele e reabra a edição.</div>`;
        }catch(e2){ msg.innerHTML=`<div class="msg error">Conflito de edição e não foi possível atualizar: ${esc(e2.message)}</div>`; }
      }else{
        msg.innerHTML=`<div class="msg error">Falha ao salvar: ${esc(err.message)}</div>`;
      }
    }
  });
}

/* ---------- imagens (POST /addImagem) ---------- */
const IMG_TYPES=['image/jpeg','image/png','image/webp'], IMG_MAX=5*1024*1024;
function renderImagemForm(filme){
  let lastOp=''; try{ lastOp=localStorage.getItem('ppg.operador')||''; }catch(e){}
  detailEl.innerHTML=`
    <div class="panel riveted" style="max-width:560px">
      <form id="formImagem">
        <h4>Adicionar imagens — filme #${filme.id}</h4>
        <div id="formMsg"></div>
        <div class="field"><label>Operador (quem fez o setup)</label><input name="nomeOperador" value="${esc(lastOp)}" autocomplete="name" required></div>
        <div class="field"><label>Descrição (opcional, vale para todas as imagens)</label><textarea name="descricao" rows="2" maxlength="300" placeholder="ex.: Bolha estável após ajuste da temperatura"></textarea></div>
        <div class="field"><label>Imagens</label>
          <div class="file-drop">
            <input type="file" id="imgFiles" accept="image/jpeg,image/png,image/webp" multiple>
            <div class="hint">JPG, PNG ou WEBP · até 5 MB por imagem</div>
            <div class="preview-grid" id="imgPreview"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="ghost" id="cancelImagem">Cancelar</button>
          <button type="submit" class="primary">Enviar imagens</button>
        </div>
      </form>
    </div>`;
  const input=$('imgFiles'), prev=$('imgPreview'); let urls=[];
  const clearPrev=()=>{ urls.forEach(u=>URL.revokeObjectURL(u)); urls=[]; prev.innerHTML=''; };
  input.addEventListener('change',()=>{
    clearPrev();
    [...input.files].forEach(f=>{ const u=URL.createObjectURL(f); urls.push(u); const im=document.createElement('img'); im.src=u; im.alt=f.name; im.title=f.name; prev.appendChild(im); });
  });
  $('cancelImagem').addEventListener('click',()=>{ clearPrev(); selectFilme(filme.id); });
  $('formImagem').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const fd=new FormData(ev.target), msg=$('formMsg'), btn=ev.target.querySelector('[type=submit]');
    const nomeOperador=String(fd.get('nomeOperador')||'').trim(), descricao=String(fd.get('descricao')||'').trim();
    const files=[...input.files];
    if(!nomeOperador){ msg.innerHTML='<div class="msg error">Informe o nome do operador.</div>'; return; }
    if(!files.length){ msg.innerHTML='<div class="msg error">Escolha ao menos uma imagem.</div>'; return; }
    const bad=files.find(f=>!IMG_TYPES.includes(f.type)||f.size>IMG_MAX);
    if(bad){ msg.innerHTML=`<div class="msg error">“${esc(bad.name)}” não é aceita: use JPG, PNG ou WEBP de até 5 MB.</div>`; return; }
    try{ localStorage.setItem('ppg.operador',nomeOperador); }catch(e){}
    btn.disabled=true;
    const falhas=[];
    for(let i=0;i<files.length;i++){
      btn.textContent=`Enviando ${i+1}/${files.length}…`;
      try{ await API.uploadImagem(filme.id,nomeOperador,descricao,files[i]); }
      catch(err){ falhas.push(`${files[i].name}: ${err.message}`); }
    }
    clearPrev();
    await loadFilmes();
    if(!falhas.length){ await selectFilme(filme.id); return; }
    msg.innerHTML=`<div class="msg error">Falha ao enviar ${falhas.length} de ${files.length} imagem(ns):<br>${falhas.map(esc).join('<br>')}</div>`;
    btn.disabled=false; btn.textContent='Enviar imagens';
  });
}

/* ---------- novo setup ---------- */
function renderNovoSetupForm(filme){
  detailEl.innerHTML=`
    <div class="panel riveted" style="max-width:600px">
      <form id="formNovoSetup">
        <h4>Novo setup — filme #${filme.id} (${fmt(filme.tamanhoDoFilme)} × ${fmt(filme.espessuraDoFilme)})</h4>
        <div id="formMsg"></div>
        <div class="row2">
          <div class="field"><label>Operador</label><input name="nomeOperador" required></div>
          <div class="field"><label>Data</label><input type="date" name="dataDeCadastro" required></div>
        </div>
        <div class="row3">
          <div class="field"><label>kg/h</label><input name="kgh" required></div>
          <div class="field"><label>Vel. rosca</label><input name="velocidadeDeRosca" required></div>
          <div class="field"><label>Vel. arraste</label><input name="velocidadeDeArraste" required></div>
        </div>
        <div class="field" style="max-width:180px"><label>Temperatura</label><input name="temperatura" required></div>
        <div class="field">
          <label>Formulação (resinas)</label>
          <div id="resinaRows"></div>
          <button type="button" class="ghost" id="addResina" style="width:fit-content">+ resina</button>
        </div>
        <div class="field"><label>Descrição do setup</label><textarea name="descricaoDoSetup" rows="3"></textarea></div>
        <div class="form-actions">
          <button type="button" class="ghost" id="cancelNovoSetup">Cancelar</button>
          <button type="submit" class="primary">Salvar setup</button>
        </div>
      </form>
    </div>`;
  addResinaRow();
  $('addResina').addEventListener('click',addResinaRow);
  $('cancelNovoSetup').addEventListener('click',()=>selectFilme(filme.id));
  $('formNovoSetup').addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const fd=new FormData(ev.target), msg=$('formMsg'), resinas=[];
    document.querySelectorAll('.resina-row').forEach(row=>{
      const nome=row.querySelector('[data-f=nomeResina]').value, p=row.querySelector('[data-f=porcentagem]').value, l=row.querySelector('[data-f=lote]').value;
      if(nome) resinas.push({ nomeResina:nome, porcentagem:p?Number(p):null, lote:l?Number(l):null });
    });
    try{
      await API.addNewSetup({
        idFilme:filme.id, kgh:fd.get('kgh'), velocidadeDeRosca:fd.get('velocidadeDeRosca'),
        velocidadeDeArraste:fd.get('velocidadeDeArraste'), temperatura:fd.get('temperatura'),
        formulacao:{ formulacao:resinas }, descricaoDoSetup:fd.get('descricaoDoSetup'),
        dataDeCadastro:fd.get('dataDeCadastro'), nomeOperador:fd.get('nomeOperador')
      });
      await loadFilmes(); selectFilme(filme.id);
    }catch(err){ msg.innerHTML=`<div class="msg error">Falha ao salvar setup: ${esc(err.message)}</div>`; }
  });
}

function addResinaRow(){
  const row=document.createElement('div'); row.className='resina-row';
  row.innerHTML=`
    <div class="field"><label>Resina</label><input data-f="nomeResina"></div>
    <div class="field"><label>%</label><input data-f="porcentagem" type="number" step="any"></div>
    <div class="field"><label>Lote</label><input data-f="lote" type="number"></div>
    <button type="button" class="ghost" aria-label="Remover resina">×</button>`;
  row.querySelector('button').addEventListener('click',()=>row.remove());
  $('resinaRows').appendChild(row);
}

/* ---------- helpers ---------- */
function fmt(v){ return (v===null||v===undefined||v==='')?'—':esc(v); }
function fmtDate(v){
  if(!v) return '—';
  const d=new Date(v);
  return isNaN(d)?esc(v):d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
